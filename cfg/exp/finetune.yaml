# @package _global_

defaults:
  - /task/patches: temporal_align
  - override /algo: ppo_roa_finetune

total_iters: 2000
checkpoint_interval: 1000
upload_interval: 1000

algo:
  freeze_vecnorm: true
  entropy_coef_start: 0.002
  entropy_coef_end: 0.001
  entropy_decay_start: 1000
  entropy_decay_end: 1500
