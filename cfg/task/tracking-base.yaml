# @package task
name: G1TrackBase
project: hdmi

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane
num_envs: 1024
max_episode_length: 4000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005

input:
  action:
    _target_: JointPosition
    action_scaling:
      .*_hip_yaw_joint: 0.55
      .*_hip_roll_joint: 0.35
      .*_hip_pitch_joint: 0.55
      .*_knee_joint: 0.35
      .*_ankle_pitch_joint: 0.44
      .*_ankle_roll_joint: 0.44
      waist_roll_joint: 0.44
      waist_pitch_joint: 0.44
      waist_yaw_joint: 0.55
      .*_shoulder_pitch_joint: 0.44
      .*_shoulder_roll_joint: 0.44
      .*_shoulder_yaw_joint: 0.44
      .*_elbow_joint: 0.44
      .*_wrist_roll_joint: 0.44
      .*_wrist_pitch_joint: 0.07
      .*_wrist_yaw_joint: 0.07
    max_delay: 6
    alpha_range: [0.8, 1.0]
    input_order: mjlab

command:
  _target_: RobotTracking
  data_path: ???
  tracking_keypoint_names: [
    ".*_hip_(pitch|yaw)_link",
    ".*_knee_link",
    ".*_ankle_roll_link",
    "pelvis",
    "torso_link",
    ".*_shoulder_pitch_link",
    ".*_elbow_link",
    ".*_wrist_yaw_link"
  ]
  tracking_joint_names: [
    "waist_.*_joint",
    ".*_hip_.*_joint",
    ".*_knee_joint",
    ".*_ankle_.*_joint",
    ".*_shoulder_.*_joint",
    ".*_elbow_joint",
    ".*_wrist_.*_joint"
  ]
  root_body_name: "pelvis"
  anchor_body_name: "torso_link"
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.1, 0.1]
    y: [-0.1, 0.1]
    z: [-0.1, 0.1]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1
  rewind_prob: 0.0
  rewind_steps_range: [25, 125]
  future_steps: [1, 2, 4, 16]

observation:
  command:
    ref_body_pos_future_local: {}
    ref_joint_pos_future: {}
  policy:
    root_ang_vel_history: {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.01}
    joint_pos_history: {history_steps: [0, 1, 2, 3], noise_std: 0.02}
    prev_actions: {steps: 3}
  priv:
    root_ang_vel_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}
    projected_gravity_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}
    joint_pos_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}
    diff_body_pos_future_local: {}
    diff_body_ori_future_local: {}
    diff_body_lin_vel_future_local: {}
    diff_body_ang_vel_future_local: {}
  ref_joint_pos_:
    ref_joint_pos_action_policy: {}

reward:
  tracking:
    tracking_body_pos:
      _target_: keypoint_pos_tracking_local_product
      body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link", ".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 1.0
      sigma: 0.3
    tracking_body_ori:
      _target_: keypoint_ori_tracking_local_product
      body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link", ".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 1.0
      sigma: 0.4
    joint_pos_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]
      weight: 0.5
      sigma: 0.25

randomization: {}

termination:
  motion_timeout: {is_timeout: true}
  cum_body_pos_error_local: {body_names: ".*", min_steps: 25, threshold: 0.8}
  cum_body_ori_error_local: {body_names: ".*", min_steps: 25, threshold: 1.6}
