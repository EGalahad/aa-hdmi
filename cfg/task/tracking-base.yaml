# @package task
name: G1TrackBase
project: hdmi

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane
enable_cameras: false

num_envs: 8192
max_episode_length: 4000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005

robot:
  # name: g1-hdmi-mode_5
  name: g1-hdmi-mode_15

input:
  action:
    _target_: hdmi.JointPosition
    action_scaling:
      .*_hip_yaw_joint: 0.55
      .*_hip_roll_joint: 0.35
      .*_hip_pitch_joint: 0.55
      .*_knee_joint: 0.35
      .*_ankle_pitch_joint: 0.44
      .*_ankle_roll_joint: 0.44
      waist_roll_joint: 0.44
      waist_pitch_joint: 0.44
      waist_yaw_joint: 0.55
      .*_shoulder_pitch_joint: 0.44
      .*_shoulder_roll_joint: 0.44
      .*_shoulder_yaw_joint: 0.44
      .*_elbow_joint: 0.44
      .*_wrist_roll_joint: 0.44
      .*_wrist_pitch_joint: 0.07
      .*_wrist_yaw_joint: 0.07
    min_delay: 2
    max_delay: 6
    alpha_range: [0.8, 1.0]

command:
  _target_: hdmi.RobotTracking
  data_path: ???
  tracking_keypoint_names: [
    ".*_hip_yaw_link",
    ".*_knee_link",
    ".*_ankle_roll_link",
    "pelvis",
    "torso_link",
    ".*_shoulder_pitch_link",
    ".*_elbow_link",
    ".*_wrist_yaw_link"
  ]
  tracking_joint_names: [
    "waist_.*_joint",
    ".*_hip_.*_joint",
    ".*_knee_joint",
    ".*_ankle_.*_joint",
    ".*_shoulder_.*_joint",
    ".*_elbow_joint",
    ".*_wrist_.*_joint"
  ]
  root_body_name: "pelvis"
  anchor_body_name: "torso_link"

  # TODO: put this into randomization reset callbacks
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.2, 0.2]
    roll: [-0.5, 0.5]
    pitch: [-0.5, 0.5]
    yaw: [-0.5, 0.5]

  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1

  rewind_prob: 0.6
  rewind_steps_range: [25, 125]
  future_steps: [-4, -2, 0, 1, 2, 3, 4, 8, 16]

observation:
  command:
    ref_body_pos_future_local:
      _target_: hdmi.ref_body_pos_future_local
    ref_joint_pos_future:
      _target_: hdmi.ref_joint_pos_future
    ref_root_ori_future_b:
      _target_: hdmi.ref_root_ori_future_b
      noise_std: 0.05
  policy:
    root_ang_vel_history:
      _target_: hdmi.root_ang_vel_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.2
    projected_gravity_history:
      _target_: hdmi.projected_gravity_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.01
    joint_pos_history:
      _target_: hdmi.joint_pos_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.02
    joint_vel_history:
      _target_: hdmi.joint_vel_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.5
    prev_actions:
      _target_: hdmi.prev_actions
      steps: 3
  priv:
    root_ang_vel_history:
      _target_: hdmi.root_ang_vel_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.0
    projected_gravity_history:
      _target_: hdmi.projected_gravity_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.0
    joint_pos_history:
      _target_: hdmi.joint_pos_history
      history_steps: [0, 1, 2, 4, 8]
      noise_std: 0.0

    ref_root_pos_future_b:
      _target_: hdmi.ref_root_pos_future_b
    ref_root_ori_future_b:
      _target_: hdmi.ref_root_ori_future_b

    diff_body_pos_future_local:
      _target_: hdmi.diff_body_pos_future_local
    diff_body_ori_future_local:
      _target_: hdmi.diff_body_ori_future_local
    diff_body_lin_vel_future_local:
      _target_: hdmi.diff_body_lin_vel_future_local
    diff_body_ang_vel_future_local:
      _target_: hdmi.diff_body_ang_vel_future_local

    body_pos_b:
      _target_: hdmi.body_pos_b
      body_names: ^(?!.*(_mimic|_toe)$).+$
    body_vel_b:
      _target_: hdmi.body_vel_b
      body_names: ^(?!.*(_mimic|_toe)$).+$

    applied_action:
      _target_: hdmi.applied_action
    applied_torque:
      _target_: hdmi.applied_torque
  ref_joint_pos_:
    ref_joint_action:
      _target_: hdmi.ref_joint_action

reward:
  tracking:
    tracking_root_pos_aligned:
      _target_: hdmi.keypoint_pos_tracking_aligned
      body_names: ["torso_link"]
      enabled: false
      look_ahead: 50
      weight: 0.5
      sigma: 0.3

    tracking_root_pos:
      _target_: hdmi.keypoint_pos_tracking_product
      body_names: ["torso_link"]
      enabled: true
      weight: 0.5
      sigma: 0.3
    tracking_root_ori:
      _target_: hdmi.keypoint_ori_tracking_product
      body_names: ["torso_link"]
      weight: 0.5
      sigma: 0.4
    tracking_root_linvel:
      _target_: hdmi.keypoint_lin_vel_tracking_product
      body_names: ["torso_link"]
      weight: 0.5
      sigma: 1.0
    tracking_root_angvel:
      _target_: hdmi.keypoint_ang_vel_tracking_product
      body_names: ["torso_link"]
      weight: 0.5
      sigma: 2.5

    tracking_body_pos:
      _target_: hdmi.keypoint_pos_tracking_local_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      sigma: 0.3
    tracking_body_ori:
      _target_: hdmi.keypoint_ori_tracking_local_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      sigma: 0.4

    tracking_body_linvel:
      _target_: hdmi.keypoint_lin_vel_tracking_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 1.0
    tracking_body_angvel:
      _target_: hdmi.keypoint_ang_vel_tracking_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 2.5


    joint_pos_tracking_product:
      _target_: hdmi.joint_pos_tracking_product
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]
      weight: 0.5
      sigma: 0.25
    joint_vel_tracking_product:
      _target_: hdmi.joint_vel_tracking_product
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]
      weight: 0.5
      sigma: 2.5

  loco:
    action_rate_l2:     {weight: 0.1, enabled: true}
    joint_pos_limits:  
      _target_: hdmi.joint_pos_limits
      weight: 10.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: true
    # joint_torque_limits: 
    #   _target_: hdmi.joint_torque_limits
    #   weight: 0.01
    #   enabled: true
    #   soft_factor: 0.6
    self_collisions:
      _target_: hdmi.self_collisions
      weight: -1.0
      enabled: true
      sensor_name: self_collision
      force_threshold: 1.0

    feet_slip:
      _target_: hdmi.feet_slip
      weight: 0.5
      tolerance: 0.0
      enabled: false
      body_names: .*ankle_roll_link

    feet_air_time:
      _target_: hdmi.feet_air_time
      weight: 5.0
      enabled: true
      body_names: .*ankle_roll_link
      thres: 0.5

    ref_contact:
      _target_: hdmi.ref_contact
      weight: 0.5
      enabled: false
      body_names: [left_ankle_roll_link, right_ankle_roll_link]
      body2_names: [left_ankle_roll_link_toe, right_ankle_roll_link_toe]
      air_h_low: 0.035
      air_h_high: 0.155
      contact_h_low: 0.035
      contact_h_high: 0.125
      feet_standing_z_enter: 0.18
      feet_standing_z_exit: 0.25
      feet_standing_vxy_enter: 0.2
      feet_standing_vxy_exit: 0.3
      feet_standing_vz_enter: 0.15
      feet_standing_vz_exit: 0.25


    survival:           {weight: 4.0, enabled: true}
  tracking_metrics:
    _enabled_: false
    root_pos_error:
      _target_: hdmi.keypoint_pos_error
      body_names: ["torso_link"]
      weight: 1.0
      enabled: false
    root_ori_error:
      _target_: hdmi.keypoint_ori_error
      body_names: ["torso_link"]
      weight: 1.0
      enabled: false
    body_pos_error_local:
      _target_: hdmi.keypoint_pos_error_local
      body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      enabled: false
    body_ori_error_local:
      _target_: hdmi.keypoint_ori_error_local
      body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      enabled: false
    joint_pos_error:
      _target_: hdmi.joint_pos_error
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"]
      weight: 1.0
      enabled: false
  loco_metrics:
    _enabled_: false
    joint_pos_limits:   
      _target_: hdmi.joint_pos_limits
      weight: 1.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: false
    
    feet_contact_count:
      _target_: hdmi.feet_contact_count
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link

    feet_contact_duration:
      _target_: hdmi.feet_contact_duration
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link

randomization:
  perturb_body_materials:
    body_names: [".*ankle_roll_link", ".*_wrist_yaw_link"]
    static_friction_range: [0.3, 1.6]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    solref_time_constant_range: [0.015, 0.03]
    solref_dampratio_range: [0.5, 2.0]
    homogeneous: true

  perturb_body_mass:
    pelvis: [0.9, 1.1]
    torso_link: [0.9, 1.1]
  perturb_body_com:
    "pelvis|torso_link": [-0.03, 0.03]

  motor_params_implicit:
    stiffness_range:
      ".*(shoulder|elbow|wrist).*": [0.9, 1.1]
      ".*(waist|hip|knee|ankle).*": [0.8, 1.2]
    damping_range:
      ".*(shoulder|elbow|wrist).*": [0.9, 1.1]
      ".*(waist|hip|knee|ankle).*": [0.8, 1.2]
    armature_range:
      .*: [0.75, 1.25]
    friction_range:
      .*: [0.05, 0.25]


  random_joint_offset:
    .*: [-0.01, 0.01]

  perturb_root_vel:
    min_s: 4.0
    max_s: 6.0

    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.1, 0.1]
    roll: [-0.2, 0.2]
    pitch: [-0.2, 0.2]
    yaw: [-0.4, 0.4]

termination:
  motion_timeout:           {is_timeout: true}

  root_pos_error_aligned:
    _target_: cum_body_pos_error_aligned
    body_names: "torso_link"
    min_steps: 25
    threshold: 0.3
    look_ahead: 50
    enabled: false

  root_pos_error:
    _target_: cum_body_pos_error
    body_names: "torso_link"
    min_steps: 25
    threshold: 0.4
    enabled: true
  root_ori_error:
    _target_: cum_body_ori_error
    body_names: "torso_link"
    min_steps: 25
    threshold: 1.2
  root_linvel_error:
    _target_: cum_body_lin_vel_error
    body_names: "torso_link"
    min_steps: 25
    threshold: 1.0
  root_angvel_error:
    _target_: cum_body_ang_vel_error
    body_names: "torso_link"
    min_steps: 25
    threshold: 2.5
  
  body_pos_error:
    _target_: cum_body_pos_error_local
    body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
    min_steps: 25
    threshold: 0.4
  body_ori_error:
    _target_: cum_body_ori_error_local
    body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
    min_steps: 25
    threshold: 0.8
  