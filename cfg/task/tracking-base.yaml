# @package task
name: G1TrackBase
project: hdmi

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane

num_envs: 8192
max_episode_length: 4000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005

robot:
  name: g1-hdmi

input:
  action:
    _target_: HDMIJointPosition
    action_scaling:
      .*_hip_yaw_joint: 0.55
      .*_hip_roll_joint: 0.35
      .*_hip_pitch_joint: 0.55
      .*_knee_joint: 0.35
      .*_ankle_pitch_joint: 0.44
      .*_ankle_roll_joint: 0.44
      waist_roll_joint: 0.44
      waist_pitch_joint: 0.44
      waist_yaw_joint: 0.55
      .*_shoulder_pitch_joint: 0.44
      .*_shoulder_roll_joint: 0.44
      .*_shoulder_yaw_joint: 0.44
      .*_elbow_joint: 0.44
      .*_wrist_roll_joint: 0.44
      .*_wrist_pitch_joint: 0.07
      .*_wrist_yaw_joint: 0.07
    min_delay: 2
    max_delay: 6
    alpha_range: [0.8, 1.0]

command:
  _target_: RobotTracking
  data_path: ???
  tracking_keypoint_names: [
    ".*_hip_(pitch|yaw)_link",
    ".*_knee_link",
    ".*_ankle_roll_link",
    "pelvis",
    "torso_link",
    ".*_shoulder_pitch_link",
    ".*_elbow_link",
    ".*_wrist_yaw_link"
  ]
  tracking_joint_names: [
    "waist_.*_joint",
    ".*_hip_.*_joint",
    ".*_knee_joint",
    ".*_ankle_.*_joint",
    ".*_shoulder_.*_joint",
    ".*_elbow_joint",
    ".*_wrist_.*_joint"
  ]
  root_body_name: "pelvis"
  anchor_body_name: "torso_link"
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.1, 0.1]
    y: [-0.1, 0.1]
    z: [-0.1, 0.1]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1
  rewind_prob: 0.0
  rewind_steps_range: [25, 125]
  future_steps: [1, 16, 32, 48]

observation:
  command:
    ref_body_pos_future_local: {}
    ref_joint_pos_future: {}
    ref_root_ori_future_b: {}
  policy:
    root_ang_vel_history: {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.01}
    joint_pos_history: {history_steps: [0, 1, 2, 3], noise_std: 0.02}
    prev_actions: {steps: 3}
  priv:
    root_ang_vel_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}
    projected_gravity_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}
    joint_pos_history: {history_steps: [0, 1, 2, 4, 8], noise_std: 0.0}

    ref_root_pos_future_b: {}
    ref_root_ori_future_b: {}

    diff_body_pos_future_local: {}
    diff_body_ori_future_local: {}
    diff_body_lin_vel_future_local: {}
    diff_body_ang_vel_future_local: {}

    body_pos_b:       {body_names: ".*ankle_roll_link"}
    body_vel_b:       {body_names: ".*ankle_roll_link"}

    # applied_action:   {}
    applied_torque:   {}
  ref_joint_pos_:
    ref_joint_pos_action_policy: {}

reward:
  tracking:
    tracking_root_pos:
      _target_: keypoint_pos_tracking_product
      body_names: ["torso_link"]
      weight: 0.5
      sigma: 0.3
    tracking_root_ori:
      _target_: keypoint_ori_tracking_product
      body_names: ["torso_link"]
      weight: 0.5
      sigma: 0.4

    tracking_body_pos:
      _target_: keypoint_pos_tracking_local_product
      body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link", ".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 1.0
      sigma: 0.3
    tracking_body_ori:
      _target_: keypoint_ori_tracking_local_product
      body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link", ".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 1.0
      sigma: 0.4

    tracking_body_linvel:
      _target_: keypoint_lin_vel_tracking_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 1.0
    tracking_body_angvel:
      _target_: keypoint_ang_vel_tracking_product
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 2.5


    joint_pos_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]
      weight: 0.5
      sigma: 0.25
    joint_vel_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]
      weight: 0.5
      sigma: 2.5

  loco:
    action_rate_l2:     {weight: 0.1, enabled: true}
    joint_pos_limits:   {weight: 10.0, joint_names: ".*", soft_factor: 0.9, enabled: true}
    joint_torque_limits: {weight: 0.01, enabled: true, soft_factor: 0.6}

    # feet_slip:          {weight: 0.5, tolerance: 0.0, enabled: false, body_names: .*ankle_roll_link}
    # feet_air_time:
    #   _target_: hdmi.feet_air_time
    #   weight: 8.0
    #   enabled: false
    #   body_names: .*ankle_roll_link
    #   thres: 0.8
    survival:           {weight: 4.0, enabled: true}
  debug:
    root_pos_error:
      _target_: keypoint_pos_error
      body_names: ["pelvis"]
      weight: 1.0
      enabled: false
    root_ori_error:
      _target_: keypoint_ori_error
      body_names: ["pelvis"]
      weight: 1.0
      enabled: false
    body_pos_error_local:
      _target_: keypoint_pos_error_local
      body_names: [".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      enabled: false
    body_ori_error_local:
      _target_: keypoint_ori_error_local
      body_names: [".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 1.0
      enabled: false
    joint_pos_error:             {joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"], weight: 1.0, enabled: false}
  debug_loco:
    joint_pos_limits:   {weight: 1.0, enabled: false, soft_factor: 0.9, joint_names: .*}
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}


randomization:
  perturb_body_materials:
    body_names: [".*ankle_roll_link", ".*_wrist_yaw_link"]
    static_friction_range: [0.6, 1.6]
    dynamic_friction_range: [0.3, 1.6]
    restitution_range: [0.0, 0.5]
    solref_time_constant_range: [0.015, 0.03]
    solref_dampratio_range: [0.5, 2.0]

  perturb_body_mass:
    .*: [0.9, 1.1]
  perturb_body_com:
    body_names: ["pelvis", "torso_link"]
    pos_range: [-0.03, 0.03]
  random_joint_offset:
    .*: [-0.01, 0.01]

termination:
  motion_timeout:           {is_timeout: true}

  cum_body_pos_error:       {body_names: "torso_link", min_steps: 25, threshold: 0.8}
  cum_body_ori_error:       {body_names: "torso_link", min_steps: 25, threshold: 1.6}

  cum_body_pos_error_local: {body_names: ".*", min_steps: 25, threshold: 0.8}
  cum_body_ori_error_local: {body_names: ".*", min_steps: 25, threshold: 1.6}
