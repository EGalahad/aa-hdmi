# @package _global_

stages:
  - name: train
    overrides:
      - +exp=train
    load_checkpoint_from_previous: false
  - name: adapt
    overrides:
      - +exp=adapt
    load_checkpoint_from_previous: true
  - name: finetune
    overrides:
      - +exp=finetune
    load_checkpoint_from_previous: true
