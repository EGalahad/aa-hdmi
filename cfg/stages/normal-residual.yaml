# @package _global_

stages:
  - name: train
    overrides:
      - +exp=ppo_roa/train
      - algo.residual_action=true
    load_checkpoint_from_previous: false
  - name: adapt
    overrides:
      - +exp=ppo_roa/adapt
      - algo.residual_action=true
    load_checkpoint_from_previous: true
  - name: finetune
    overrides:
      - +exp=ppo_roa/finetune
      - algo.residual_action=true
    load_checkpoint_from_previous: true
