# @package _global_

stages:
  - name: train
    overrides:
      - +exp=train
      - algo.residual_action=true
    load_checkpoint_from_previous: false
  - name: adapt
    overrides:
      - +exp=adapt
      - algo.residual_action=true
    load_checkpoint_from_previous: true
  - name: finetune
    overrides:
      - +exp=finetune
      - algo.residual_action=true
    load_checkpoint_from_previous: true
