# @package _global_

stages:
  - name: train-single
    overrides:
      - +exp=train-single
    load_checkpoint_from_previous: false
  - name: adapt-single
    overrides:
      - +exp=adapt-single
    load_checkpoint_from_previous: true
  - name: finetune-single
    overrides:
      - +exp=finetune-single
      - +task/patches=temporal_align
    load_checkpoint_from_previous: true
